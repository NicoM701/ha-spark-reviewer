name: Spark PR Review
version: "0.1.1"
slug: spark_review
description: Spark-only diff reviews for NicoM701, with no model fallback
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: true
stage: experimental
options:
  enabled: false
  publish: false
  interval_minutes: 10
schema:
  enabled: bool
  publish: bool
  interval_minutes: int(10,1440)
map:
  - type: addon_config
    read_only: false
backup_exclude:
  - "config/codex"
  - "config/gh"
